quarkus.application.name=rainyun-agent-user-db
quarkus.http.port=8080
quarkus.http.root-path=/
quarkus.http.limits.max-body-size=64K
quarkus.http.access-log.enabled=true
quarkus.jackson.fail-on-unknown-properties=false
quarkus.hibernate-orm.database.generation=none
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=db/migration

%dev.quarkus.datasource.db-kind=h2
%dev.quarkus.datasource.jdbc.url=jdbc:h2:mem:rainyun;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=sa
%dev.quarkus.hibernate-orm.database.generation=validate
%dev.app.cookie-secure=false

%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/rainyun_agent}
%prod.quarkus.datasource.username=${DATABASE_USER:rainyun_agent}
%prod.quarkus.datasource.password=${DATABASE_PASSWORD:}
%prod.quarkus.hibernate-orm.database.generation=validate

rainyun.api-base-url=${RAINYUN_API_BASE_URL:https://api.v2.rainyun.com}
rainyun.agent-uid=${RAINYUN_AGENT_UID:0}
rainyun.timeout-seconds=${RAINYUN_TIMEOUT_SECONDS:8}
app.admin.username=${APP_ADMIN_USERNAME:admin}
app.admin.password-hash=${APP_ADMIN_PASSWORD_HASH:}
app.session-secret=${APP_SESSION_SECRET:}
app.credential-encryption-key=${APP_CREDENTIAL_ENCRYPTION_KEY:}
app.cookie-secure=${APP_COOKIE_SECURE:true}
app.public-base-url=${APP_PUBLIC_BASE_URL:http://localhost:8080}
