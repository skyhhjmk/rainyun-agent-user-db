<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>账号已连接 · 雨云代理商平台</title>
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body>
  <header class="topbar"><a class="brand" href="/account"><span class="brand-mark">R</span><span>雨云代理商平台</span></a><form method="post" action="/logout"><button class="button button-quiet" type="submit">退出</button></form></header>
  <main class="page narrow">
    <p class="eyebrow">ACCOUNT LINKED</p><h1>账号已安全连接</h1>
    <section class="panel profile-card"><div class="avatar">{name.substring(0,1)}</div><div><h2>{name}</h2><p class="muted">雨云 UID <code>{uid}</code></p></div><span class="status status-active">已验证</span></section>
    <p class="muted">你可以关闭此页面。通过授权的第三方应用只能获得你同意的基本资料。</p>
  </main>
</body>
</html>
